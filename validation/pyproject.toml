[project]
name = "pa-validation"
version = "0.0.0"
description = "Independent NumPy and SciPy models that cross-check the TypeScript physics."
requires-python = ">=3.13"
dependencies = ["numpy>=2.1", "scipy>=1.14"]

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.115", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["pa_validation", "scripts"]
