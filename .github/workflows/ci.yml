# Gates on every pull request (master plan, "Gates on every pull request").
# Actions are referenced by version tag here; Renovate's pinGitHubActionDigests
# rewrites them to full commit SHAs in its first pull request, as the plan requires.
#
# Gates not wired yet, because there is nothing for them to check until Phase 1 builds it:
#   Figures (Anatomy audit and line check) — arrives with packages/apparatus.
#   AI (evaluation suite) — arrives with the first prompt in apps/api.
#   Translation (missing strings) — arrives with the first message file in packages/i18n.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: Types, lint and tests (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  e2e:
    name: End to end, accessibility and performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
        working-directory: e2e
      - run: bun run e2e
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  api:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pa_app
          POSTGRES_PASSWORD: pa_app
          POSTGRES_DB: physics_anatomy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pa_app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pa_app:pa_app@localhost:5432/physics_anatomy_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  physics-validation:
    name: Physics validation (independent Python models)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: validation
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerabilities:
    name: Known vulnerabilities
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.0.0
    permissions:
      contents: read
      security-events: write
      actions: read
