[project]
name = "physics-anatomy-api"
version = "0.0.0"
description = "The Physics Anatomy API: accounts, sync, live classes, AI, exports."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "coverage>=7.6",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.ruff.lint.isort]
known-first-party = ["app"]
