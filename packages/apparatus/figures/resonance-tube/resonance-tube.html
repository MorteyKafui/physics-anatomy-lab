<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Resonance tube</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>/* The resonance tube figure. Every colour is a mix of the kit's own tokens, so both themes follow. */
.rt {
  --rt-glass: color-mix(in srgb, var(--anatomy-paper) 86%, var(--anatomy-mid));
  --rt-bore: color-mix(in srgb, var(--anatomy-paper) 93%, var(--anatomy-lo));
  --rt-water: color-mix(
    in srgb,
    color-mix(in srgb, var(--anatomy-paper) 72%, var(--anatomy-mid)) 90%,
    var(--anatomy-blue)
  );
  --rt-water-top: color-mix(in srgb, var(--rt-water) 70%, var(--anatomy-hi));
  --rt-shine: var(--anatomy-hi);
  --rt-key-ring: color-mix(in srgb, var(--anatomy-text) 18%, transparent);
  --rt-key-on: color-mix(in srgb, var(--anatomy-text) 9%, transparent);
}

.rt .iso-plate {
  overflow: hidden;
}

/* Sentence case (design/README.md): the kit sets the title and hint in capitals. */
.rt .iso-plate-corner[data-corner="title"],
.rt .iso-plate-corner[data-corner="hint"] {
  text-transform: none;
  letter-spacing: 0.04em;
}

.rt-stage {
  position: relative;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  cursor: ns-resize;
}

.rt-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

.rt-said {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.rt-glass {
  fill: var(--rt-glass);
}

.rt-bore {
  fill: var(--rt-bore);
}

.rt-glassy .iso-fill,
.rt-glassy .iso-top,
.rt-glassy .iso-shade {
  fill: var(--rt-glass);
}

.rt-glass-edge {
  fill: none;
}

.rt-shine {
  fill: var(--rt-shine);
  opacity: 0.16;
}

.rt-shine-soft {
  opacity: 0.08;
}

.rt-water {
  fill: var(--rt-water);
}

.rt-water-top {
  fill: var(--rt-water-top);
}

.rt-env {
  stroke-width: 0.9;
  fill: none;
}

.rt-antinode {
  fill: none;
  stroke: var(--anatomy-lit);
  stroke-width: 0.7;
}

.rt-ring {
  stroke-width: 0.9;
}

.rt-mercury {
  stroke-width: 1.1;
}

/* Choosing a legend entry picks its part out. */
.rt-stage[data-focus] .it:not([data-on]) {
  --anatomy-hi: var(--anatomy-mid);
  --anatomy-mid: var(--anatomy-lo);
  --anatomy-lit: var(--anatomy-mid);
}

.rt-stage[data-focus] [data-on] {
  --anatomy-hi: var(--anatomy-lit);
  --anatomy-mid: var(--anatomy-hi);
  --anatomy-lit: var(--anatomy-strong);
}

.rt-stage[data-focus] .it[data-on] .iso-top {
  fill: var(--anatomy-lit-top);
}

.rt-stage[data-focus] .it[data-on] .iso-shade {
  fill: var(--anatomy-lit-shade);
}

.rt-keys {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.rt-key {
  padding: 5px 10px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--anatomy-muted);
  font:
    12.5px/1.3 ui-sans-serif,
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
  text-align: left;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--rt-key-ring);
  transition:
    color 160ms var(--anatomy-ease),
    background 160ms var(--anatomy-ease);
}

.rt-key:hover,
.rt-key:focus-visible,
.rt-key[aria-pressed="true"] {
  color: var(--anatomy-strong);
  background: var(--rt-key-on);
  outline: none;
}

@media (max-width: 640px) {
  .rt .iso-plate {
    padding: 44px 6px 64px;
  }

  .rt .iso-plate-corner[data-corner="hint"] {
    max-width: 46%;
  }
}

rface: the closed end of the air column</button><button type="button" class="rt-key" data-key="reservoir" aria-pressed="false">Reservoir on a ring, joined by rubber tubing</button><button type="button" class="rt-key" data-key="fork" aria-pressed="false">Tuning fork, struck on the rubber pad</button><button type="button" class="rt-key" data-key="rule" aria-pressed="false">Metre rule, zero at the mouth</button><button type="button" class="rt-key" data-key="thermometer" aria-pressed="false">Thermometer, for the speed of sound</button><button type="button" class="rt-key" data-key="stand" aria-pressed="false">Retort stand: base, rods, boss heads and clamps</button></span><span class="iso-caption" data-caption>A 512 Hz fork over a tube of 2.0 cm inside radius at 28 °C, where sound travels at 347.9 m/s. The air column, closed by the water and open at the mouth, is loudest when L + e is an odd number of quarter wavelengths, with the end correction e = 0.6r = 1.2 cm: here at L = 15.8 cm and 49.8 cm and 83.7 cm. The water surface is always a displacement node, and the antinode sits 1.2 cm above the mouth.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };

function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];

}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {

    if (run)

    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {

        const dx = bx - ax;
        const dy = by - ay;

        for (let index = 0; index < count; index++) {

            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));

    }
    let bevel;
    if (options.bevel && options.bevel > 0) {

    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));

    if (x.groups.size !== y.groups.size) return false;

    levels[0].groups.get(tone).forEach((arc, index) => {

    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));

      refine(mid, b, depth + 1);

    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }

  return buckets;
}

function sideOf(meridian) {

  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));

  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);

  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");

  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));

  return { fill, outline, gap };

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    midS.push(Math.sin(t));

  const tones = [];

    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];

    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),

}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);

  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

    shape.forEach(([s, r], index) => {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

  const L = lightOf(P);

  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);

  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));

  const tones = [];
  for (let j = 0; j < n; j++) {

    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));

  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }

    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));

    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));

    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",

    shades: buckets.slice(0, 4).map((list) => list.join("")),

function prismOf(F, polygon, s0, s1, P) {

function stadium(r0, r1, offset, steps = 32) {

function sphereOf(centre, r, P, { steps = 48 } = {}) {

  const top = [tx, ty, NIPPLE.z0 + 3];
  const points = [
    top,
    [tx, ty, 9],
    [tx - 6, HOSE_Y, HOSE_R],
    [rx + 8, HOSE_Y, HOSE_R],
    [rx, ry, Math.min(9, resTip - 4)],
    [rx, ry, resTip + RES_TIP_LIFT],
  ];
  return G.fillet(points, 7, 10, { P, tube: HOSE_R });
}
function hoseSvg(resTip) {
  const pieces = tubePieces(hoseRoute(resTip), HOSE_R, P, { maxLength: 400, spacing: 1.2 });
  return pieces.map((piece) => tubeSvg(piece, { tone: "mid" })).join("");
}
const ROD_R = 2.1;
function rodSvg(x, y, z0, z1, cap) {
  return (
    k.solidSvg(k.cylinder(x, y, ROD_R, z0, z1 - z0 - (cap ? 1.2 : 0), P, 24), {
      tone: "mid",
      crease: "none",
    }) +
    (cap ? k.solidSvg(k.cylinder(x, y, ROD_R + 0.2, z1 - 1.2, 1.2, P, 24), { tone: "mid" }) : "")
  );
}

const root = document.querySelector(".rt");
const stage = root.querySelector(".rt-stage");
const svg = stage.querySelector("svg");
const said = stage.querySelector(".rt-said");
const readout = root.querySelector("[data-readout]");
const caption = root.querySelector("[data-caption]");
const waterG = svg.querySelector('[data-live="water"]');
const waveG = svg.querySelector('[data-live="wave"]');
const soundG = svg.querySelector('[data-live="sound"]');
const forkG = svg.querySelector('[data-live="fork"]');
const hoseG = svg.querySelector('[data-live="hose"]');
const movers = [...svg.querySelectorAll('[data-move="reservoir"]')];
const rodLo = svg.querySelector('[data-live="rod-lo"]');
const rodHi = svg.querySelector('[data-live="rod-hi"]');
const keys = [...root.querySelectorAll(".rt-key")];
const still = matchMedia("(prefers-reduced-motion: reduce)");

const TUBE_M = D.tube;
const v = MODEL.speedOfSound(TUBE_M.temperatureC);
const e = MODEL.endCorrection(TUBE_M);
const cm = (m) => (m * 100).toFixed(1);
const levelOf = (L) => D.Z_MOUTH - L * 100 * D.U;
const tipOf = (L) => levelOf(L) - D.RES_WATER;
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

// Screen-right across the tube, in the vertical plane through its axis that faces the viewer.
const ACROSS = (() => {
  const n = Math.hypot(D.V[0], D.V[1]);
  return [D.V[1] / n, -D.V[0] / n, 0];
})();
const inPlane = (w, z) => iso([D.TUBE[0] + ACROSS[0] * w, D.TUBE[1] + ACROSS[1] * w, z], P);

let fi = D.forkStart;
let L = D.L;
let target = D.L;
let clock = 0;
let struck = 0;
// The tour waits at the first resonance for a few seconds, so the first thing seen is the loud one.
let touring = false;
let tourClock = 0; // set from the water's level when the tour starts
let idleTimer = 0;
let last = 0;
let frame = 0;
let visible = false;
let drawnTip = NaN;
let drawnFork = -1;
let dragging = null;

const f = () => D.forks[fi];

function drawWater() {
  const z = levelOf(L);
  const body = cylinder(D.TUBE[0], D.TUBE[1], D.R_IN - 0.05, D.Z_BOTTOM, z - D.Z_BOTTOM, P, 64);
  waterG.innerHTML = `<path class="rt-water" d="${body.fill}"/><path class="rt-water-top" d="${body.top}"/><path class="iso-line rt-meniscus" data-tone="hi" d="${ring(D.TUBE[0], D.TUBE[1], D.R_IN - 0.05, z, P, 64)}"/>`;
}

function drawReservoir() {
  const tip = tipOf(L);
  const dz = tip - D.resTip0;
  const t = translateAlong(P, [0, 0, dz]);
  for (const node of movers) node.setAttribute("transform", t);
  if (!(Math.abs(tip - drawnTip) <= 0.04)) {
    hoseG.innerHTML = hoseSvg(tip);
    // The second rod, in its pieces below and above the moving boss head.
    const [x, y] = D.ROD2;
    const boss = D.resBossZ + dz;
    rodLo.innerHTML = rodSvg(x, y, 6, boss - 6, false);
    rodHi.innerHTML = rodSvg(x, y, boss + 6, D.ROD2_TOP, true);
    drawnTip = tip;
  }
}

function drawFork() {
  if (drawnFork === fi) return;
  forkG.innerHTML = forkSvg(f(), 0);
  drawnFork = fi;
  // Group the two prongs so they can swing without a rebuild.
  const prongs = [...forkG.querySelectorAll(".iso-solid[data-lit]")];
  prongs.forEach((node, index) => node.setAttribute("data-prong", index === 0 ? "1" : "-1"));
}

// How loud the column sounds now: the steady loudness times the struck fork's amplitude.
const level = () =>
  MODEL.loudness(TUBE_M, L, f()) * (MODEL.forkAmplitude(clock - struck, MODEL.FORK_TAU) ?? 0);

function drawWave(phase, sound) {
  const wave = MODEL.standingWave(TUBE_M, L, f());
  if (!wave) return (waveG.innerHTML = "");
  const zWater = levelOf(L);
  const half = D.R_IN - 1.1;
  const amp = clamp(sound, 0, 1.0001);
  // Envelope: the air's largest displacement, |sin kx|, from the water up to the antinode e
  // above the mouth, mirrored about the axis.
  const kx = (2 * Math.PI) / wave.wavelength;
  const top = -e;
  const steps = Math.max(24, Math.round((L - top) * 400));
  const left = [];
  const right = [];
  for (let i = 0; i <= steps; i++) {
    const depth = L - ((L - top) * i) / steps;
    const s = Math.abs(Math.sin(kx * (L - depth)));
    const z = D.Z_MOUTH - depth * 100 * D.U;
    left.push(inPlane(-half * s * amp, z));
    right.push(inPlane(half * s * amp, z));
  }
  const env =
    amp > 0.02
      ? `<path class="iso-line rt-env" data-tone="lit" data-free="" d="${pathOf(left)}${pathOf(right)}"/>`
      : "";
  // Air particles: columns across the bore, each moved up and down by the standing wave.
  const dots = [];
  const swing = 2.6 * amp;
  const rows = Math.floor((zWater < D.Z_MOUTH ? D.Z_MOUTH - zWater : 0) / 5.2);
  for (let r = 0; r < rows; r++) {
    const z0 = zWater + 2.6 + r * 5.2;
    const depth = (D.Z_MOUTH - z0) / (100 * D.U);
    const air = MODEL.airAt(TUBE_M, L, f(), depth, phase);
    if (!air) continue;
    const z = z0 + ((air.displacement * swing) / Math.max(amp, 1e-6)) * amp;
    for (const w of [-3.9, -1.95, 0, 1.95, 3.9])
      dots.push(inPlane(w, clamp(z, zWater + 0.6, D.Z_MOUTH - 0.4)));
  }
  const nodes = wave.nodes.map((d) => inPlane(0, D.Z_MOUTH - d * 100 * D.U));
  const antinodes = wave.antinodes.map((d) => inPlane(0, D.Z_MOUTH - d * 100 * D.U));
  waveG.innerHTML =
    env +
    `<g class="rt-air">${dotsSvg(dots, { size: 0.55, tone: "hi" })}</g>` +
    (amp > 0.02
      ? `<g class="rt-marks">${dotsSvg(nodes, { size: 1.3, tone: "lit" })}${antinodes.map(([x, y]) => `<circle class="rt-antinode" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2"/>`).join("")}</g>`
      : "");
}

// Sound leaving the mouth: rings that spread and fade, as bright as the column is loud.
function drawSound(time, sound) {
  if (sound < 0.01) return (soundG.innerHTML = "");
  const [cx, cy] = iso([D.TUBE[0], D.TUBE[1], D.Z_MOUTH + e * 100 * D.U], P);
  const out = [];
  const span = 60;
  for (let i = 0; i < 4; i++) {
    const r = ((time * 18 + i * (span / 4)) % span) + 8;
    const fade = sound * Math.pow(1 - (r - 8) / span, 1.4);
    if (fade < 0.01) continue;
    const a0 = Math.PI * 1.12;
    const a1 = Math.PI * 1.88;
    const p = [];
    for (let j = 0; j <= 24; j++) {
      const a = a0 + ((a1 - a0) * j) / 24;
      p.push([cx + r * Math.cos(a), cy + r * Math.sin(a) * 0.86]);
    }
    out.push(
      `<path class="iso-line rt-ring" data-tone="hi" data-free="" style="opacity:${fade.toFixed(3)}" d="${pathOf(p)}"/>`,
    );
  }
  soundG.innerHTML = out.join("");
}

function captionFor() {
  const fits = MODEL.resonanceLengths(TUBE_M, f());
  return `A ${f()} Hz fork over a tube of ${cm(TUBE_M.radius)} cm inside radius at ${TUBE_M.temperatureC} °C, where sound travels at ${v.toFixed(1)} m/s. The air column, closed by the water and open at the mouth, is loudest when L + e is an odd number of quarter wavelengths, with the end correction e = 0.6r = ${cm(e)} cm: here at L = ${fits.map(cm).join(" cm and ")} cm. The water surface is always a displacement node, and the antinode sits ${cm(e)} cm above the mouth.`;
}

let lastText = "";
function drawText() {
  const db = MODEL.loudnessDb(TUBE_M, L, f());
  const text = `f ${f()} Hz · L ${cm(L)} cm · v ${v.toFixed(1)} m/s · e ${cm(e)} cm · ${db > -0.5 ? "0" : db.toFixed(0)} dB`;
  if (text === lastText) return;
  lastText = text;
  readout.textContent = text;
  stage.setAttribute("aria-valuenow", String(Math.round(L * 100)));
  stage.setAttribute("aria-valuetext", text);
}

function draw(phase, time) {
  drawFork();
  drawWater();
  drawReservoir();
  const sound = still.matches ? MODEL.loudness(TUBE_M, L, f()) : level();
  drawWave(phase, sound);
  drawSound(time, still.matches ? 0 : sound);
  const swing = still.matches
    ? 0
    : 0.7 * (MODEL.forkAmplitude(clock - struck, MODEL.FORK_TAU) ?? 0) * Math.sin(phase * 1.0);
  for (const node of forkG.querySelectorAll("[data-prong]"))
    node.setAttribute("transform", translateAlong(P, [0, 0, Number(node.dataset.prong) * swing]));
  drawText();
}

const resonances = () =>
  MODEL.resonanceLengths(TUBE_M, f()).filter((l) => l >= D.range[0] && l <= D.range[1]);

// The idle tour: sweep the water slowly through every resonance, striking the fork as it goes.
const TOUR = 26;
const [TOUR_LO, TOUR_HI] = [D.range[0] + 0.04, D.range[1] - 0.04];
const tourAt = (t) =>
  TOUR_LO + (TOUR_HI - TOUR_LO) * (0.5 - 0.5 * Math.cos((t / TOUR) * Math.PI * 2));
// The tour starts from wherever the water is now.
const tourFrom = (l) =>
  (TOUR * Math.acos(clamp(1 - (2 * (l - TOUR_LO)) / (TOUR_HI - TOUR_LO), -1, 1))) / (Math.PI * 2);

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  if (touring) {
    tourClock += dt;
    target = tourAt(tourClock);
    if (clock - struck > 4.5) struck = clock;
  }
  L += (target - L) * (1 - Math.exp(-dt / 0.3));
  if (Math.abs(target - L) < 1e-5) L = target;
  draw(clock * Math.PI * 2 * 0.9, clock);
  const sounding = (MODEL.forkAmplitude(clock - struck, MODEL.FORK_TAU) ?? 0) > 0.004;
  frame =
    visible && (touring || sounding || L !== target || dragging) ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible && !still.matches) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

function hold() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (still.matches) return;
    touring = true;
    tourClock = tourFrom(L);
    run();
  }, 8000);
}

function steer(next) {
  hold();
  target = clamp(next, D.range[0], D.range[1]);
  if (still.matches) {
    L = target;
    draw(0, 0);
  }
  run();
}

function strike() {
  hold();
  struck = clock;
  said.textContent = `The ${f()} Hz fork is struck.`;
  run();
}

function setFork(next) {
  hold();
  fi = (next + D.forks.length) % D.forks.length;
  caption.textContent = captionFor();
  struck = clock;
  said.textContent = `${f()} Hz fork. It resonates at ${resonances()
    .map((l) => cm(l) + " cm")
    .join(" and ")}.`;
  if (still.matches) draw(0, 0);
  run();
}

stage.addEventListener("pointerdown", (event) => {
  dragging = { y: event.clientY, L: target };
  stage.setPointerCapture(event.pointerId);
  hold();
});
stage.addEventListener("pointermove", (event) => {
  if (!dragging) return;
  const box = svg.getBoundingClientRect();
  const perUnit = (box.height / D.H) * D.screenRise;
  const dz = (dragging.y - event.clientY) / perUnit;
  steer(dragging.L - dz / (100 * D.U));
});
const release = () => {
  dragging = null;
};
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("keydown", (event) => {
  const step = event.shiftKey ? 0.05 : 0.005;
  if (event.key === "ArrowUp") steer(target - step);
  else if (event.key === "ArrowDown") steer(target + step);
  else if (event.key === "PageUp") steer(target - 0.05);
  else if (event.key === "PageDown") steer(target + 0.05);
  else if (event.key === "Home") steer(D.range[0]);
  else if (event.key === "End") steer(D.range[1]);
  else if (event.key === "ArrowLeft") setFork(fi - 1);
  else if (event.key === "ArrowRight") setFork(fi + 1);
  else if (event.key === " " || event.key === "Enter") strike();
  else return;
  event.preventDefault();
});

// Legend: choosing an entry picks its part out.
const SELECT = {
  tube: '.it[data-piece="tube"]',
  wave: '[data-live="wave"]',
  water: '[data-live="water"]',
  reservoir: '.it[data-piece="reservoir"]',
  fork: '.it[data-piece="fork"], .it[data-piece="pad"]',
  rule: '.it[data-piece="rule"]',
  thermometer: '.it[data-piece="thermometer"]',
  stand: '.it[data-piece="stand"]',
};
let picked = null;
function pick(id) {
  picked = picked === id ? null : id;
  for (const node of svg.querySelectorAll("[data-on]")) node.removeAttribute("data-on");
  if (picked)
    for (const node of svg.querySelectorAll(SELECT[picked])) node.setAttribute("data-on", "");
  stage.toggleAttribute("data-focus", Boolean(picked));
  for (const key of keys) key.setAttribute("aria-pressed", String(key.dataset.key === picked));
}
for (const key of keys) key.addEventListener("click", () => pick(key.dataset.key));

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

tourClock = tourFrom(L);
if (!still.matches)
  idleTimer = setTimeout(() => {
    touring = true;
    tourClock = tourFrom(L);
    run();
  }, 5000);
drawFork();
draw(0, 0);
window.__rt = { steer, setFork, strike, pick, state: () => ({ L, target, f: f(), touring }) };
</script></body></html>
